<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лист персонажа — Хань Фу</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">☠ <span>Лист персонажа</span></div>
  <div class="actions">
    <button id="saveBtn" class="btn btn-green">💾 Сохранить</button>
    <button id="exportBtn" class="btn">⬇ Экспорт</button>
    <button id="importBtn" class="btn">⬆ Импорт</button>
    <input type="file" id="importFile" accept=".json" hidden>
    <button id="resetBtn" class="btn btn-danger">✖ Сброс</button>
  </div>
</header>

<main class="grid">

  <!-- ШАПКА ПЕРСОНАЖА -->
  <section class="card card-wide">
    <h2>Персонаж</h2>
    <div class="row">
      <div class="field">
        <label>Имя</label>
        <input type="text" data-key="name" placeholder="Хань Фу">
      </div>
      <div class="field">
        <label>Раса</label>
        <input type="text" data-key="race" placeholder="Шанец">
      </div>
      <div class="field">
        <label>Размер</label>
        <input type="text" data-key="size" placeholder="Средний">
      </div>
      <div class="field">
        <label>Класс</label>
        <input type="text" data-key="class" placeholder="Жрец">
      </div>
      <div class="field">
        <label>Мультикласс</label>
        <input type="text" data-key="multiclass" placeholder="Второй класс">
      </div>
    </div>
  </section>

  <!-- ХАРАКТЕРИСТИКИ + ПОДКЛАССЫ (в один ряд) -->
  <section class="card-half">
    <div class="card">
      <h2>Общие характеристики</h2>
      <div class="stat-grid-2">
        <div class="stat">
          <label>Здоровье</label>
          <input type="number" data-key="hp" placeholder="30">
        </div>
        <div class="stat">
          <label>Защита</label>
          <input type="text" data-key="defense" placeholder="9+1+2">
        </div>
        <div class="stat">
          <label>Скорость</label>
          <input type="number" data-key="speed" placeholder="6">
        </div>
        <div class="stat">
          <label>Вера</label>
          <input type="number" data-key="faith" placeholder="-70">
        </div>
      </div>
    </div>
  </section>

  <section class="card-half">
    <div class="card">
      <h2>Подклассы</h2>
      <div id="subclassList"></div>
      <button class="btn btn-add" id="addSubclassBtn">+ Добавить подкласс</button>
    </div>
  </section>

  <!-- РАЗУМ / ТЕЛО / ГАРМОНИЯ -->
  <section class="card card-wide">
    <h2>Характеристики навыков</h2>
    <div class="skill-columns">
      <div class="skill-col">
        <h3>Разум</h3>
        <div class="skill-list" data-group="mind"></div>
      </div>
      <div class="skill-col">
        <h3>Тело</h3>
        <div class="skill-list" data-group="body"></div>
      </div>
      <div class="skill-col">
        <h3>Гармония</h3>
        <div class="skill-list" data-group="harmony"></div>
      </div>
    </div>
  </section>

  <!-- ЯЧЕЙКИ ЗАКЛИНАНИЙ — ПРЯМО НА ГЛАВНОЙ -->
  <section class="card card-wide">
    <h2>Ячейки заклинаний</h2>
    <div id="slotsContainer"></div>
  </section>

  <!-- ЗАКЛИНАНИЯ -->
  <section class="card card-wide">
    <div class="section-header">
      <h2>Заклинания</h2>
      <button class="btn-toggle" data-target="spellContainer">▾ Скрыть</button>
    </div>
    <div id="spellContainer"></div>
    <button class="btn btn-add" id="addSpellBtn">+ Добавить заклинание</button>
  </section>

  <!-- ЭФФЕКТЫ -->
  <section class="card card-wide">
    <div class="section-header">
      <h2>Эффекты и навыки</h2>
      <button class="btn-toggle" data-target="effectList">▾ Скрыть</button>
    </div>
    <div id="effectList"></div>
    <button class="btn btn-add" id="addEffectBtn">+ Добавить эффект</button>
  </section>

  <!-- АКТИВНЫЕ -->
  <section class="card card-wide">
    <div class="section-header">
      <h2>Активные навыки</h2>
      <button class="btn-toggle" data-target="activeList">▾ Скрыть</button>
    </div>
    <div id="activeList"></div>
    <button class="btn btn-add" id="addActiveBtn">+ Добавить активный навык</button>
  </section>

  <!-- ПАССИВНЫЕ -->
  <section class="card card-wide">
    <div class="section-header">
      <h2>Пассивные навыки</h2>
      <button class="btn-toggle" data-target="passiveList">▾ Скрыть</button>
    </div>
    <div id="passiveList"></div>
    <button class="btn btn-add" id="addPassiveBtn">+ Добавить пассивный навык</button>
  </section>

  <!-- ИНВЕНТАРЬ -->
  <section class="card card-wide">
    <h2>Инвентарь</h2>
    <div id="bagContainer"></div>
    <button class="btn btn-add" id="addBagBtn">+ Создать сумку</button>
    <div class="total-weight">
      Общий вес: <span id="totalWeight">0</span>
    </div>
  </section>

  <!-- СНАРЯЖЕНИЕ -->
  <section class="card card-wide">
    <h2>Снаряжение</h2>
    <div id="equipList"></div>
    <button class="btn btn-add" id="addEquipBtn">+ Добавить снаряжение</button>
    <div class="field" style="margin-top:14px">
      <label>Свободные очки</label>
      <input type="number" data-key="freePoints" placeholder="0">
    </div>
  </section>

  <!-- КОШЕЛЬ -->
  <section class="card">
    <h2>Кошель</h2>
    <div class="stat-grid">
      <div class="stat">
        <label>Золото</label>
        <input type="number" data-key="gold" placeholder="14">
      </div>
      <div class="stat">
        <label>Серебро</label>
        <input type="number" data-key="silver" placeholder="10">
      </div>
      <div class="stat">
        <label>Токены</label>
        <input type="number" data-key="tokens" placeholder="0">
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  <span>Лист персонажа · Абсолютный Мир</span>
</footer>

<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
